<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>指尖情书</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 86C22 66 10 50 10 34 10 20 21 10 34 10c7 0 13 3 16 8 3-5 9-8 16-8 13 0 24 10 24 24 0 16-12 32-40 52z' fill='%23e78aa8'/%3E%3C/svg%3E">
<style>
  @font-face { font-family: "Fredoka"; src: url("./assets/fonts/fredoka-500.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
  @font-face { font-family: "Fredoka"; src: url("./assets/fonts/fredoka-600.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: swap; }
  @font-face { font-family: "DM Serif Display"; src: url("./assets/fonts/dm-serif-display-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "Luckiest Guy"; src: url("./assets/fonts/luckiest-guy-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }

  :root {
    --cream: #fff6e6;
    --cocoa: #43332a;
    --blush: #e78aa8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17100d; }
  body {
    font-family: "Fredoka", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #cam {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: 0; pointer-events: none;
  }
  #scene {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; touch-action: none;
  }

  /* ---------- overlay chrome ---------- */
  .ui-chrome { transition: opacity .35s ease; }
  body.ui-hidden .ui-chrome { opacity: 0 !important; pointer-events: none !important; }

  #nameBox {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    left: max(16px, env(safe-area-inset-left));
    z-index: 20;
    display: flex; flex-direction: column; align-items: flex-start; gap: 7px;
  }
  .to-pill {
    display: inline-flex; align-items: center; gap: 5px;
    border: 0; cursor: pointer;
    background: rgba(255, 249, 239, .93);
    color: #3d2f27;
    font-family: "Fredoka", "PingFang SC", sans-serif;
    font-weight: 600; font-size: 12.5px; letter-spacing: .02em;
    padding: 6px 12px 7px;
    border-radius: 999px;
    box-shadow: 0 3px 14px rgba(70, 40, 30, .16);
    transition: transform .18s ease, background .18s ease;
  }
  .to-pill:hover { transform: translateY(-1px); background: #fffdf7; }
  .to-pill .heart { color: #d76b8c; font-size: 12px; transform: translateY(-.5px); }

  .name-line {
    display: flex; align-items: baseline;
    max-width: min(78vw, 900px);
    margin-left: 2px;
    opacity: 0; transform: translateY(-4px) scale(.98);
    transition: opacity .25s ease, transform .25s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  .name-line.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .name-line .to-word {
    font-family: "Fredoka", "PingFang SC", sans-serif;
    font-weight: 600;
    font-size: clamp(34px, 6.4vw, 66px);
    color: var(--cream);
    text-shadow: 0 2px 16px rgba(70, 35, 25, .30), 0 1px 3px rgba(70, 35, 25, .22);
    padding-right: .28em;
    letter-spacing: .005em;
  }
  #nameInput {
    font-family: "Fredoka", "PingFang SC", sans-serif;
    font-weight: 600;
    font-size: clamp(34px, 6.4vw, 66px);
    line-height: 1.1;
    color: var(--cream);
    caret-color: #ffd9a8;
    text-shadow: 0 2px 16px rgba(70, 35, 25, .30), 0 1px 3px rgba(70, 35, 25, .22);
    outline: none;
    min-width: 1.2em;
    max-width: min(62vw, 760px);
    overflow: hidden;
    white-space: nowrap;
    letter-spacing: .005em;
    border-bottom: 2px solid transparent;
  }
  #nameInput:focus { border-bottom-color: rgba(255, 246, 230, .35); }

  #hintPill {
    position: fixed;
    left: max(16px, env(safe-area-inset-left));
    bottom: max(14px, env(safe-area-inset-bottom));
    z-index: 20;
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(255, 247, 235, .22);
    border: 1px solid rgba(255, 250, 242, .28);
    backdrop-filter: blur(8px) saturate(1.2);
    -webkit-backdrop-filter: blur(8px) saturate(1.2);
    color: rgba(255, 250, 242, .94);
    font-size: 11px; letter-spacing: .03em;
    box-shadow: 0 2px 12px rgba(50, 30, 20, .10);
    transition: opacity .25s ease;
  }
  #hintPill.off { opacity: .45; }
  #hintPill .key {
    display: inline-grid; place-items: center;
    min-width: 17px; height: 17px; padding: 0 4px;
    border-radius: 5px;
    background: rgba(255, 250, 242, .86);
    color: #4a382c;
    font-size: 10px; font-weight: 600;
    box-shadow: 0 1px 2px rgba(40, 20, 10, .18);
  }

  #legend {
    position: fixed;
    right: max(16px, env(safe-area-inset-right));
    bottom: max(12px, env(safe-area-inset-bottom));
    z-index: 20;
    text-align: right;
    font-family: "Fredoka", "PingFang SC", sans-serif;
    font-size: 10.5px; line-height: 1.6;
    letter-spacing: .015em;
    color: rgba(255, 250, 243, .78);
    text-shadow: 0 1px 5px rgba(45, 25, 18, .45);
    pointer-events: none;
  }
  #legend .dim { opacity: .7; }

  #recDot {
    position: fixed;
    top: max(18px, env(safe-area-inset-top));
    right: max(18px, env(safe-area-inset-right));
    z-index: 20;
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px;
    border-radius: 999px;
    background: rgba(40, 18, 16, .42);
    color: #ffe9ea;
    font-size: 11px; letter-spacing: .08em;
    backdrop-filter: blur(6px);
  }
  #recDot[hidden] { display: none; }
  #recDot i {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ff5b6e;
    box-shadow: 0 0 8px rgba(255, 80, 100, .9);
    animation: blink 1.1s ease-in-out infinite;
  }
  @keyframes blink { 50% { opacity: .35; } }

  #qualityToast {
    position: fixed;
    top: max(18px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%) translateY(-6px);
    z-index: 30;
    padding: 7px 16px;
    border-radius: 999px;
    background: rgba(255, 249, 238, .9);
    color: #5a4035;
    font-size: 12px;
    letter-spacing: .1em;
    box-shadow: 0 5px 20px rgba(80, 45, 35, .18);
    opacity: 0;
    transition: opacity .25s ease, transform .25s ease;
    pointer-events: none;
  }
  #qualityToast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #qualityBtn {
    position: fixed;
    top: max(54px, calc(env(safe-area-inset-top) + 36px));
    right: max(16px, env(safe-area-inset-right));
    z-index: 20;
    min-width: 36px;
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid rgba(255, 250, 242, .34);
    background: rgba(255, 247, 235, .18);
    backdrop-filter: blur(8px) saturate(1.2);
    -webkit-backdrop-filter: blur(8px) saturate(1.2);
    color: rgba(255, 250, 242, .92);
    font-family: "Fredoka", "PingFang SC", sans-serif;
    font-weight: 600;
    font-size: 10px;
    letter-spacing: .1em;
    cursor: pointer;
    transition: opacity .25s ease, background .2s ease;
  }
  #qualityBtn:hover { background: rgba(255, 247, 235, .32); }
  #qualityBtn.sd { opacity: .6; }

  #soundTip {
    position: fixed;
    left: 50%; bottom: max(56px, calc(env(safe-area-inset-bottom) + 44px));
    transform: translateX(-50%);
    z-index: 24;
    padding: 8px 16px;
    border-radius: 999px;
    background: rgba(255, 249, 238, .88);
    color: #62473a;
    font-size: 12px; letter-spacing: .03em;
    box-shadow: 0 5px 22px rgba(80, 45, 35, .18);
    transition: opacity .4s ease, transform .4s ease;
    animation: soundFloat 2.4s ease-in-out infinite;
  }
  #soundTip.gone { opacity: 0; transform: translateX(-50%) translateY(8px); pointer-events: none; }
  @keyframes soundFloat { 50% { transform: translateX(-50%) translateY(-4px); } }

  /* ---------- loader ---------- */
  #loader {
    position: fixed; inset: 0; z-index: 60;
    display: grid; place-items: center;
    background:
      radial-gradient(1100px 760px at 50% 34%, #fff9f0 0%, #ffe9ee 52%, #f4d3de 100%);
    transition: opacity .6s ease;
    padding: 24px;
  }
  #loader.gone { opacity: 0; pointer-events: none; }
  .loader-card {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    text-align: center;
    transform: translateY(-4vh);
  }
  .loader-heart {
    width: 74px; height: 74px;
    filter: drop-shadow(0 8px 18px rgba(214, 112, 145, .28));
    animation: beat 1.3s ease-in-out infinite;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    12% { transform: scale(1.13); }
    24% { transform: scale(1.02); }
    36% { transform: scale(1.09); }
    52% { transform: scale(1); }
  }
  .loader-title {
    font-size: 26px; font-weight: 600; color: #5a3f34;
    letter-spacing: .14em; margin-top: 2px;
  }
  .loader-sub {
    font-size: 12.5px; color: #9a6f66; letter-spacing: .06em;
    min-height: 1.4em;
  }
  .loader-note {
    margin-top: 10px; font-size: 11.5px; line-height: 1.7;
    color: #a37c72; max-width: 360px;
  }
  .loader-note[hidden] { display: none; }
  .retry-btn {
    margin-top: 6px;
    border: 0; cursor: pointer;
    padding: 9px 22px; border-radius: 999px;
    background: #ef9db6; color: #fffdf8;
    font-family: inherit; font-size: 13px; letter-spacing: .08em;
    box-shadow: 0 6px 18px rgba(214, 112, 145, .35);
  }
  .retry-btn:hover { background: #e98aa8; }
  .retry-btn[hidden] { display: none; }

  @media (max-width: 720px) {
    #legend { font-size: 9px; max-width: 68vw; }
    #legend .wide { display: none; }
    #hintPill { font-size: 10px; }
    #soundTip { font-size: 11px; }
  }
</style>
</head>
<body>

<video id="cam" playsinline muted autoplay></video>
<canvas id="scene"></canvas>

<div id="nameBox" class="ui-chrome">
  <button id="toPill" class="to-pill" title="写下收信人的名字">to <span class="heart">♡</span></button>
  <div id="nameLine" class="name-line">
    <span class="to-word">to</span><span id="nameInput" contenteditable="true" spellcheck="false" role="textbox" aria-label="收信人的名字"></span>
  </div>
</div>

<div id="hintPill" class="ui-chrome"><span class="key">E</span> words · voice</div>

<div id="legend" class="ui-chrome">
  <div>thumb taps a finger, it speaks · right ring ♥ · right pinky ✿ · left pinky 💌</div>
  <div>E words &amp; voice · K hand lines · M mirror</div>
  <div>R record · S snapshot · H hide · Q quality</div>
</div>

<div id="recDot" hidden><i></i><span id="recTime">REC 00:00</span></div>
<button id="qualityBtn" class="ui-chrome" title="切换画质（Q）">HD</button>

<div id="qualityToast" class="ui-chrome"></div>
<div id="soundTip" class="ui-chrome">轻点一下页面，让情书开口说话 ♪</div>

<div id="loader">
  <div class="loader-card">
    <svg class="loader-heart" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M50 87C21 66 9 50 9 33.5 9 19 20.5 9 33.5 9c6.8 0 12.8 2.9 16.5 8 3.7-5.1 9.7-8 16.5-8C79.5 9 91 19 91 33.5 91 50 79 66 50 87z" fill="#ef9db6"/>
      <ellipse cx="32" cy="30" rx="7.5" ry="5" fill="#ffd7e2" opacity=".75" transform="rotate(-28 32 30)"/>
    </svg>
    <div class="loader-title">指尖情书</div>
    <div class="loader-sub" id="loaderStatus">正在准备手部魔法…</div>
    <div class="loader-note" id="loaderNote" hidden>请确认浏览器已允许使用摄像头。<br>建议用 Chrome / Edge 打开，并通过本地服务器访问。</div>
    <button class="retry-btn" id="retryBtn" hidden>再试一次</button>
  </div>
</div>

<script type="module">
import { FilesetResolver, HandLandmarker } from "./assets/vision_bundle.js";

/* ------------------------------------------------------------------ */
/*  basics                                                             */
/* ------------------------------------------------------------------ */
const $ = (s) => document.querySelector(s);
const canvas = $("#scene");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = true;
ctx.imageSmoothingQuality = "high";
const video = $("#cam");
const nameInput = $("#nameInput");
const nameLine = $("#nameLine");
const toPill = $("#toPill");
const hintPill = $("#hintPill");
const loader = $("#loader");
const loaderStatus = $("#loaderStatus");
const loaderNote = $("#loaderNote");
const retryBtn = $("#retryBtn");
const soundTip = $("#soundTip");
const qualityToast = $("#qualityToast");
const qualityBtn = $("#qualityBtn");
let qualityToastTimer = 0;
function showQualityToast(text) {
  qualityToast.textContent = text;
  qualityToast.classList.add("show");
  clearTimeout(qualityToastTimer);
  qualityToastTimer = setTimeout(() => qualityToast.classList.remove("show"), 1400);
}
function setQuality(q) {
  state.quality = q;
  resize();
  qualityBtn.textContent = q === "high" ? "HD" : "SD";
  qualityBtn.classList.toggle("sd", q !== "high");
  try { localStorage.setItem("fingertip-love-quality", q); } catch (e) {}
  showQualityToast(q === "high" ? "画质 · 高清" : "画质 · 流畅");
}
qualityBtn.addEventListener("click", () => {
  setQuality(state.quality === "high" ? "standard" : "high");
});
const recDot = $("#recDot");
const recTime = $("#recTime");

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;

const wordSprites = new Map();
const emojiSprites = new Map();
let sealSprite = null;

const QUALITY = {
  high: { dprMax: 2, pixelCap: 6_000_000 },
  standard: { dprMax: 1.35, pixelCap: 2_600_000 },
};

const state = {
  mirror: true,
  lines: true,
  words: true,
  recording: false,
  audioUnlocked: false,
  quality: "high",
  dpr: Math.min(1.5, window.devicePixelRatio || 1),
  cw: 0, ch: 0,
  map: null,
  hands: [],
  wordStates: new Map(),
  ghosts: [],
  particles: [],
  ripples: [],
  flowers: [],
  seal: null,
  lastTouch: new Map(),
  touchFrames: new Map(),
  touchFired: new Map(),
  lastTapTime: new Map(),
  lastHandTap: new Map(),
  ambientTimer: 0,
  time: 0,
  fontReady: false,
  landmarker: null,
  rec: null,
  recChunks: [],
  recStart: 0,
  recStream: null,
  micStream: null,
  glow: 0,
  detectMs: 0,
};

/* ------------------------------------------------------------------ */
/*  canvas sizing                                                      */
/* ------------------------------------------------------------------ */
function resize() {
  state.cw = window.innerWidth;
  state.ch = window.innerHeight;
  const preset = QUALITY[state.quality] || QUALITY.high;
  let dpr = Math.min(preset.dprMax, window.devicePixelRatio || 1);
  dpr = Math.max(1, dpr);
  const px = state.cw * state.ch * dpr * dpr;
  if (px > preset.pixelCap) {
    dpr = Math.max(1, dpr * Math.sqrt(preset.pixelCap / px));
  }
  state.dpr = dpr;
  canvas.width = Math.round(state.cw * dpr);
  canvas.height = Math.round(state.ch * dpr);
  canvas.style.width = state.cw + "px";
  canvas.style.height = state.ch + "px";
  wordSprites.clear();
  emojiSprites.clear();
  sealSprite = null;
}
window.addEventListener("resize", resize);
try {
  const savedQuality = localStorage.getItem("fingertip-love-quality");
  if (savedQuality === "high" || savedQuality === "standard") state.quality = savedQuality;
} catch (e) {}
resize();
qualityBtn.textContent = state.quality === "high" ? "HD" : "SD";
qualityBtn.classList.toggle("sd", state.quality !== "high");

function coverMap() {
  const vw = video.videoWidth || 1280;
  const vh = video.videoHeight || 720;
  const cw = state.cw, ch = state.ch;
  const s = Math.max(cw / vw, ch / vh);
  const dw = vw * s, dh = vh * s;
  return { vw, vh, cw, ch, dw, dh, dx: (cw - dw) / 2, dy: (ch - dh) / 2 };
}

/* ------------------------------------------------------------------ */
/*  fonts                                                              */
/* ------------------------------------------------------------------ */
async function loadFonts() {
  try {
    await Promise.all([
      document.fonts.load('600 40px "Fredoka"'),
      document.fonts.load('500 40px "Fredoka"'),
      document.fonts.load('40px "DM Serif Display"'),
      document.fonts.load('40px "Luckiest Guy"'),
    ]);
    await document.fonts.ready;
  } catch (e) { /* system fallback is okay */ }
  state.fontReady = true;
}

/* ------------------------------------------------------------------ */
/*  audio helpers                                                      */
/* ------------------------------------------------------------------ */

// their TTS engine to wake up. speechSynthesis stays as a fallback.

let audioCtx = null;
const speech = {
  buffers: Object.create(null),
  loading: false,
  ready: false,
  voice: null,
  source: null,
};

function refreshVoices() {
  if (!("speechSynthesis" in window)) return;
  const voices = window.speechSynthesis.getVoices();
  speech.voice =
    voices.find((v) => /en[-_]US/i.test(v.lang)) ||
    voices.find((v) => /^en/i.test(v.lang)) ||
    null;
}
if ("speechSynthesis" in window) {
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}

function initAudioContext() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) {}
}
function ensureAudio() {
  initAudioContext();
  try {
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) {}
}
async function loadSpeechClips() {
  if (speech.loading || speech.ready) return;
  initAudioContext();
  if (!audioCtx) return;
  speech.loading = true;
  try {
    for (const [word, url] of Object.entries(SPEECH_CLIPS)) {
      const res = await fetch(url);
      const arr = await res.arrayBuffer();
      speech.buffers[word] = await audioCtx.decodeAudioData(arr);
    }
    speech.ready = true;
  } catch (e) {
    /* TTS fallback handles it */
  }
  speech.loading = false;
}

function stopSpeech() {
  if (speech.source) {
    try { speech.source.stop(); } catch (e) {}
    speech.source = null;
  }
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();
}

function speakFallback(text) {
  if (!state.words || !("speechSynthesis" in window)) return;
  refreshVoices();
  const synth = window.speechSynthesis;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.92;
  u.pitch = 1.08;
  u.volume = 1;
  if (speech.voice) u.voice = speech.voice;
  try {
    if (synth.speaking || synth.pending) {
      synth.cancel();
      setTimeout(() => { try { synth.speak(u); } catch (e) {} }, 60);
    } else {
      synth.speak(u);
    }
  } catch (e) {}
}

function warmSpeech() {
  if (!("speechSynthesis" in window)) return;
  refreshVoices();
  try {
    const u = new SpeechSynthesisUtterance("a");
    u.lang = "en-US";
    u.volume = 0.001;
    u.rate = 2;
    if (speech.voice) u.voice = speech.voice;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

function playWord(word) {
  if (!state.words) return;
  ensureAudio();
  const buf = speech.buffers[word];
  if (buf && audioCtx) {
    try {
      if (speech.source) {
        try { speech.source.stop(); } catch (e) {}
      }
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      const gain = audioCtx.createGain();
      gain.gain.value = 0.95;
      src.connect(gain).connect(audioCtx.destination);
      src.onended = () => { if (speech.source === src) speech.source = null; };
      src.start();
      speech.source = src;
      return;
    } catch (e) {}
  }
  speakFallback(word);
}

function chime(freq = 720, dur = 0.28, type = "sine", gain = 0.05) {
  if (!state.audioUnlocked || !audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(freq * 1.35, t + dur * 0.7);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

const TIP_INDEX = 8, TIP_MIDDLE = 12, TIP_RING = 16, TIP_PINKY = 20;

function wordFont(style, px) {
  switch (style.font) {
    case "serif":  return `${px}px "DM Serif Display", Georgia, serif`;
    case "serifB": return `600 ${px}px "DM Serif Display", Georgia, serif`;
    case "bubble": return `600 ${px}px "Fredoka", "PingFang SC", sans-serif`;
    case "chunky": return `${px}px "Luckiest Guy", "Fredoka", sans-serif`;
    default:       return `${px}px "Fredoka", sans-serif`;
  }
}
function wordGradientOn(g, px, fill, cx, cy) {
  if (fill !== "gradBlue") return fill;
  const grad = g.createLinearGradient(cx, cy - px * 0.5, cx, cy + px * 0.28);
  grad.addColorStop(0, "#e6f9ff");
  grad.addColorStop(0.55, "#bfeaf8");
  grad.addColorStop(1, "#93d5ee");
  return grad;
}

/* words are pre-rendered into small sprites and reused across frames */
function getWordSprite(style, size) {
  const px = clamp(Math.round(size), 10, 240);
  const key = style.text + "|" + style.font + "|" + px;
  let spr = wordSprites.get(key);
  if (spr) return spr;

  ctx.save();
  ctx.font = wordFont(style, px);
  const metrics = ctx.measureText(style.text);
  ctx.restore();

  const padX = px * 0.42;
  const padY = px * 0.48;
  const w = Math.ceil(metrics.width + padX * 2);
  const h = Math.ceil(px * 1.5 + padY * 2);
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.ceil(w * state.dpr));
  c.height = Math.max(1, Math.ceil(h * state.dpr));
  const g = c.getContext("2d");
  g.scale(state.dpr, state.dpr);
  const cx = w / 2, cy = h / 2;
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.lineJoin = "round";
  g.lineCap = "round";
  g.font = wordFont(style, px);

  g.shadowColor = "rgba(50,28,22,.26)";
  g.shadowBlur = px * 0.16;
  g.shadowOffsetY = px * 0.06;

  g.strokeStyle = style.outer;
  g.lineWidth = Math.max(2, px * 0.19);
  g.strokeText(style.text, cx, cy);

  g.strokeStyle = style.stroke;
  g.lineWidth = Math.max(1, px * 0.06);
  g.strokeText(style.text, cx, cy);

  g.shadowColor = "transparent";
  g.shadowBlur = 0;
  g.shadowOffsetY = 0;
  g.fillStyle = wordGradientOn(g, px, style.fill, cx, cy);
  g.fillText(style.text, cx, cy);

  spr = { canvas: c, w, h };
  wordSprites.set(key, spr);
  if (wordSprites.size > 120) {
    wordSprites.delete(wordSprites.keys().next().value);
  }
  return spr;
}

function drawWordAt(style, x, y, anchorPx, drawPx, rot, alpha) {
  const spr = getWordSprite(style, anchorPx);
  const k = drawPx / anchorPx;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.globalAlpha = alpha;
  ctx.drawImage(spr.canvas, (-spr.w * k) / 2, (-spr.h * k) / 2, spr.w * k, spr.h * k);
  ctx.restore();
}
function drawWord(style, x, y, size, rot, alpha) {
  const anchor = Math.max(8, Math.round(size / 2) * 2);
  drawWordAt(style, x, y, anchor, size, rot, alpha);
}

function getEmojiSprite(emoji, size) {
  const px = clamp(Math.round(size / 2) * 2, 10, 520);
  const key = emoji + "|" + px;
  let spr = emojiSprites.get(key);
  if (spr) return spr;

  const side = Math.ceil(px * 1.38);
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.ceil(side * state.dpr));
  c.height = Math.max(1, Math.ceil(side * state.dpr));
  const g = c.getContext("2d");
  g.scale(state.dpr, state.dpr);
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.font = `${px}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
  g.shadowColor = "rgba(60,30,25,.20)";
  g.shadowBlur = px * 0.06;
  g.shadowOffsetY = px * 0.03;
  g.fillText(emoji, side / 2, side / 2);

  spr = { canvas: c, w: side, h: side, px };
  emojiSprites.set(key, spr);
  if (emojiSprites.size > 90) {
    emojiSprites.delete(emojiSprites.keys().next().value);
  }
  return spr;
}
function drawEmojiAt(emoji, x, y, anchorPx, drawPx, rot, alpha) {
  const spr = getEmojiSprite(emoji, anchorPx);
  const k = drawPx / spr.px;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.globalAlpha = alpha;
  ctx.drawImage(spr.canvas, (-spr.w * k) / 2, (-spr.h * k) / 2, spr.w * k, spr.h * k);
  ctx.restore();
}
function drawEmoji(emoji, x, y, size, rot, alpha) {
  const anchor = Math.max(10, Math.round(size / 2) * 2);
  drawEmojiAt(emoji, x, y, anchor, size, rot, alpha);
}

/* wax seal with a heart, used for the pinky surprise */
function getSealSprite() {
  if (sealSprite) return sealSprite;
  const W = 760, H = 760;
  const c = document.createElement("canvas");
  c.width = Math.ceil(W * state.dpr);
  c.height = Math.ceil(H * state.dpr);
  const g = c.getContext("2d");
  g.scale(state.dpr, state.dpr);

  const cx = W / 2, cy = H / 2, R = 278;
  const rnd = (a, b) => a + Math.random() * (b - a);

  const sealPath = (x, r, wob = 1) => {
    x.beginPath();
    const n = 140;
    for (let i = 0; i <= n; i++) {
      const a = (i / n) * TAU;
      const k = 1
        + 0.022 * Math.sin(a * 7 + 1.3) * wob
        + 0.014 * Math.sin(a * 13 + 0.4) * wob
        + 0.008 * Math.sin(a * 23 + 2.1) * wob;
      const rr = r * k;
      const px = cx + Math.cos(a) * rr;
      const py = cy + Math.sin(a) * rr;
      if (i === 0) x.moveTo(px, py);
      else x.lineTo(px, py);
    }
    x.closePath();
  };
  const heartInto = (x, hx, hy, s, rot = 0) => {
    x.save();
    x.translate(hx, hy);
    x.rotate(rot);
    x.scale(s, s);
    x.beginPath();
    x.moveTo(0, 8);
    x.bezierCurveTo(-9, 0, -9.8, -6.6, -5.3, -8);
    x.bezierCurveTo(-2.4, -8.9, -0.6, -6.5, 0, -5);
    x.bezierCurveTo(0.6, -6.5, 2.4, -8.9, 5.3, -8);
    x.bezierCurveTo(9.8, -6.6, 9, 0, 0, 8);
    x.closePath();
    x.restore();
  };

  // soft colored halo (a gradient instead of a filter, for older phones)
  const halo = g.createRadialGradient(cx, cy, R * 0.45, cx, cy, R * 1.2);
  halo.addColorStop(0, "rgba(150,15,45,.32)");
  halo.addColorStop(1, "rgba(150,15,45,0)");
  g.fillStyle = halo;
  g.beginPath();
  g.arc(cx, cy, R * 1.2, 0, TAU);
  g.fill();

  // wax body
  sealPath(g, R, 1);
  const wg = g.createRadialGradient(cx - R * 0.32, cy - R * 0.36, R * 0.08, cx, cy, R * 1.15);
  wg.addColorStop(0, "#d94563");
  wg.addColorStop(0.45, "#b81f41");
  wg.addColorStop(0.8, "#8c0d2a");
  wg.addColorStop(1, "#640619");
  g.fillStyle = wg;
  g.save();
  g.shadowColor = "rgba(60,0,16,.35)";
  g.shadowBlur = 22;
  g.shadowOffsetY = 8;
  g.fill();
  g.restore();

  // little wax blobs at the rim
  for (let i = 0; i < 10; i++) {
    const a = rnd(0, TAU);
    const rr = R * rnd(0.93, 1.02);
    const x = cx + Math.cos(a) * rr;
    const y = cy + Math.sin(a) * rr;
    g.save();
    g.translate(x, y);
    g.rotate(a);
    g.fillStyle = `rgba(${(120 + rnd(-20, 20)) | 0},${(10 + rnd(0, 18)) | 0},${(30 + rnd(0, 18)) | 0},${rnd(0.35, 0.7)})`;
    g.beginPath();
    g.ellipse(0, 0, rnd(8, 24), rnd(4, 11), 0, 0, TAU);
    g.fill();
    g.restore();
  }

  // embossed inner ring
  g.save();
  g.lineWidth = 5;
  g.strokeStyle = "rgba(255,200,210,.22)";
  g.beginPath(); g.arc(cx - 2, cy - 3, R * 0.80, 0, TAU); g.stroke();
  g.strokeStyle = "rgba(70,0,18,.22)";
  g.beginPath(); g.arc(cx + 2, cy + 3, R * 0.80, 0, TAU); g.stroke();
  g.restore();

  // tiny dots around the ring
  for (let i = 0; i < 28; i++) {
    const a = (i / 28) * TAU;
    const rr = R * 0.885;
    g.beginPath();
    g.arc(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, 3.4, 0, TAU);
    g.fillStyle = i % 2 ? "rgba(255,205,215,.26)" : "rgba(70,0,18,.30)";
    g.fill();
  }

  // wax speckles
  g.save();
  sealPath(g, R * 0.97);
  g.clip();
  for (let i = 0; i < 260; i++) {
    const a = rnd(0, TAU);
    const rr = Math.sqrt(Math.random()) * R * 0.97;
    const x = cx + Math.cos(a) * rr;
    const y = cy + Math.sin(a) * rr;
    g.fillStyle = Math.random() < 0.5
      ? `rgba(255,180,195,${rnd(0.02, 0.06)})`
      : `rgba(60,0,16,${rnd(0.02, 0.07)})`;
    g.beginPath();
    g.ellipse(x, y, rnd(0.7, 2.6), rnd(0.7, 2.2), rnd(0, TAU), 0, TAU);
    g.fill();
  }
  g.restore();

  // sheen at the top left
  g.save();
  g.strokeStyle = "rgba(255,225,230,.16)";
  g.lineWidth = 26;
  g.lineCap = "round";
  g.beginPath();
  g.arc(cx, cy, R * 0.68, Math.PI * 1.03, Math.PI * 1.46);
  g.stroke();
  g.restore();

  // embossed cream heart
  const hs = (R / 16) * 0.92;
  heartInto(g, cx + 3, cy + 6, hs);
  g.fillStyle = "rgba(70,0,18,.32)";
  g.fill();
  heartInto(g, cx, cy, hs);
  const hg = g.createLinearGradient(0, cy - 9 * hs, 0, cy + 8 * hs);
  hg.addColorStop(0, "#fff4e3");
  hg.addColorStop(0.55, "#f7dcc0");
  hg.addColorStop(1, "#e6b89c");
  g.fillStyle = hg;
  g.fill();
  heartInto(g, cx - 3, cy - 4, hs * 0.93);
  g.fillStyle = "rgba(255,255,255,.20)";
  g.fill();
  g.lineWidth = 3;
  g.strokeStyle = "rgba(120,40,35,.18)";
  heartInto(g, cx, cy, hs);
  g.stroke();

  sealSprite = { canvas: c, w: W, h: H };
  return sealSprite;
}

/* ------------------------------------------------------------------ */
/*  hand landmarker                                                    */
/* ------------------------------------------------------------------ */
async function createLandmarker(delegate) {
  const vision = await FilesetResolver.forVisionTasks("./assets/wasm");
  return HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "./assets/hand_landmarker.task",
      delegate,
    },
    runningMode: "VIDEO",
    numHands: 2,
    minHandDetectionConfidence: 0.5,
    minHandPresenceConfidence: 0.5,
    minTrackingConfidence: 0.5,
  });
}

async function initLandmarker() {
  try {
    state.landmarker = await createLandmarker("GPU");
  } catch (e) {
    state.landmarker = await createLandmarker("CPU");
  }
}

/* ------------------------------------------------------------------ */
/*  camera                                                             */
/* ------------------------------------------------------------------ */
async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error("这台浏览器不支持摄像头访问。");
  }
  const stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: "user",
      width: { ideal: 1920 },
      height: { ideal: 1080 },
      frameRate: { ideal: 30, max: 30 },
    },
    audio: false,
  });
  video.srcObject = stream;
  await video.play().catch(() => {});
  await new Promise((resolve) => {
    if (video.readyState >= 2) return resolve();
    video.addEventListener("loadeddata", resolve, { once: true });
  });
}

/* ------------------------------------------------------------------ */
/*  hand geometry helpers                                              */
/* ------------------------------------------------------------------ */
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
// z is converted to canvas pixels in buildHand; MediaPipe's depth is much
// noisier than x/y, so it only nudges the distance.
function touchDistance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y, (a.zPx - b.zPx) * 0.2);
}

function buildHand(lm, map) {
  const pts = lm.map((p) => ({
    x: map.dx + (state.mirror ? 1 - p.x : p.x) * map.dw,
    y: map.dy + p.y * map.dh,
    z: p.z,
    zPx: (p.z || 0) * map.dw,
  }));
  const palm = [0, 5, 9, 13, 17].reduce((acc, i) => ({ x: acc.x + pts[i].x / 5, y: acc.y + pts[i].y / 5 }), { x: 0, y: 0 });
  const scale = dist(pts[0], pts[9]) || 60;
  return { pts, palm, scale, side: palm.x < state.cw * 0.5 ? "A" : "B", z: pts[9].z || 0 };
}

function updateHands(result, map) {
  const hands = (result.landmarks || []).map((lm) => buildHand(lm, map));
  // stable left/right assignment when both hands share a side
  hands.sort((a, b) => a.palm.x - b.palm.x);
  if (hands.length === 2) {
    hands[0].side = "A";
    hands[1].side = "B";
  } else if (hands.length === 1) {
    hands[0].side = hands[0].palm.x < state.cw * 0.5 ? "A" : "B";
  }
  state.hands = hands;

  // drop touch state for hands that are no longer visible, so a hand that
  // briefly leaves the frame can't fire on the first frame it comes back
  const sides = new Set(hands.map((h) => h.side));
  for (const store of [state.lastTouch, state.touchFrames, state.touchFired]) {
    for (const key of [...store.keys()]) {
      if (!sides.has(key.split(":")[0])) store.delete(key);
    }
  }

  detectTouches(hands);
}

/* ------------------------------------------------------------------ */
/*  touches: thumb taps a finger, it speaks                            */
/* ------------------------------------------------------------------ */
const TOUCH_TIPS = [TIP_INDEX, TIP_MIDDLE, TIP_RING, TIP_PINKY];

function detectTouches(hands) {
  for (const hand of hands) {
    const thumb = hand.pts[4];
    const dists = TOUCH_TIPS.map((tipIdx) => touchDistance(thumb, hand.pts[tipIdx]) / hand.scale);
    let nearest = 0;
    for (let i = 1; i < dists.length; i++) {
      if (dists[i] < dists[nearest]) nearest = i;
    }

    TOUCH_TIPS.forEach((tipIdx, i) => {
      const key = hand.side + ":" + tipIdx;
      const d = dists[i];
      const was = state.lastTouch.get(key) || false;
      // hysteresis: come close to start, clearly leave to reset
      const touching = was ? d < 0.70 : d < 0.55;

      if (!touching) {
        state.touchFrames.set(key, 0);
        state.touchFired.set(key, false);
        state.lastTouch.set(key, false);
        return;
      }

      const frames = (state.touchFrames.get(key) || 0) + 1;
      state.touchFrames.set(key, frames);

      // the finger should be somewhat extended; a loosely closed fist brings
      // the tips close to the thumb without meaning to tap
      const extended = dist(hand.pts[0], hand.pts[tipIdx]) / hand.scale > 1.12;

      // a very obvious contact fires immediately; otherwise the contact has
      // to persist for two detections. Only the closest finger may speak.
      const confirmed = frames >= 2 || d < 0.32;

      if (confirmed && !state.touchFired.get(key) && i === nearest) {
        if (!extended) {
          // a fist can look like a tap for a moment; don't let that same
          // contact fire later when the hand opens
          state.touchFired.set(key, true);
        } else {
          const now = performance.now();
          const last = state.lastTapTime.get(key) || 0;
          const handLast = state.lastHandTap.get(hand.side) || 0;
          if (now - last > 500 && now - handLast > 200) {
            state.lastTapTime.set(key, now);
            state.lastHandTap.set(hand.side, now);
            state.touchFired.set(key, true);
            onFingerTap(hand, tipIdx);
          } else {
            state.touchFired.set(key, true);
          }
        }
      }
      state.lastTouch.set(key, true);
    });
  }
}

function onFingerTap(hand, tipIdx) {
  const tip = hand.pts[tipIdx];
  const styleMap = WORDS[hand.side];
  const which = tipIdx === TIP_INDEX ? "index" : tipIdx === TIP_MIDDLE ? "middle" : null;
  const style = which ? styleMap[which] : null;
  const color = style ? (style.fill === "gradBlue" ? "#bfeaf8" : style.fill) : "#ffd7e2";

  state.glow = 1;
  burstHearts(tip.x, tip.y, 8 + Math.floor(Math.random() * 4), color);
  state.ripples.push({ x: tip.x, y: tip.y, r0: hand.scale * 0.08, r1: hand.scale * 0.9, life: 0.6, max: 0.6, color });
  chime(tipIdx === TIP_PINKY ? 560 : 760, 0.26, "sine", 0.045);

  if (which) {
    playWord(style.word);
    // a big echo of the word
    spawnGhost(hand.side, which, tip, hand, true);
    burstSparkles(tip.x, tip.y, 7, color);
  } else if (tipIdx === TIP_RING) {
    burstHearts(tip.x, tip.y, 6, "#ffb7cb");
  } else if (tipIdx === TIP_PINKY) {
    if (hand.side === "B") triggerSeal();
    else burstFlowers();
  }
}

/* ------------------------------------------------------------------ */
/*  effects: hearts, sparkles, flowers, wax seal                       */
/* ------------------------------------------------------------------ */
const HEART_COLORS = ["#ff9fbe", "#ffc0d3", "#ffe3ea", "#fff3e6", "#ff7fa6"];
function spawnHeart(x, y, color, size, vx, vy, life = 2.4) {
  state.particles.push({
    kind: "heart", x, y, vx, vy,
    color: color || HEART_COLORS[(Math.random() * HEART_COLORS.length) | 0],
    size: size || rand(7, 15), rot: rand(-0.5, 0.5), vr: rand(-1.4, 1.4),
    life, max: life, sway: rand(0.6, 1.6), phase: rand(0, TAU),
  });
}
function burstHearts(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU);
    const sp = rand(30, 150);
    spawnHeart(x + Math.cos(a) * 8, y + Math.sin(a) * 8, color, rand(7, 16),
      Math.cos(a) * sp, Math.sin(a) * sp - 30, rand(1.4, 2.8));
  }
}
function burstSparkles(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU);
    const sp = rand(40, 170);
    state.particles.push({
      kind: "spark", x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      color: color || "#fff4d6", size: rand(3, 8), rot: rand(0, TAU), vr: rand(-3, 3),
      life: rand(0.5, 0.9), max: 0.9,
    });
  }
}
function burstFlowers() {
  const emojis = ["🌸", "🌷", "🌺", "💮", "✿"];
  for (let i = 0; i < 14; i++) {
    state.flowers.push({
      emoji: emojis[(Math.random() * emojis.length) | 0],
      x: rand(state.cw * 0.05, state.cw * 0.95),
      y: state.ch + rand(10, 80),
      vy: rand(-150, -80),
      size: rand(16, 34),
      rot: rand(-0.4, 0.4),
      sway: rand(10, 34),
      phase: rand(0, TAU),
      life: rand(2.6, 4.2), max: 4.2,
    });
  }
  if (state.flowers.length > 70) state.flowers.splice(0, state.flowers.length - 70);
  chime(880, 0.5, "triangle", 0.04);
}
function triggerSeal() {
  const x = state.cw * 0.5;
  const y = state.ch * 0.38;
  const unit = Math.min(state.cw, state.ch);
  state.seal = { t: 0, dur: 2.8, x, y, rot: -0.05 };
  state.ripples.push({
    x, y,
    r0: unit * 0.10,
    r1: unit * 0.52,
    life: 0.7, max: 0.7,
    color: "#ffd9e2",
  });
  for (let i = 0; i < 18; i++) {
    const a = rand(0, TAU);
    const sp = rand(40, 220);
    spawnHeart(
      x + Math.cos(a) * 30,
      y + Math.sin(a) * 30,
      Math.random() < 0.3 ? "#fff1e3" : null,
      rand(7, 16),
      Math.cos(a) * sp,
      Math.sin(a) * sp - 30,
      rand(1.4, 2.6)
    );
  }
  for (let i = 0; i < 4; i++) {
    const a = rand(0, TAU);
    const sp = rand(30, 90);
    state.particles.push({
      kind: "emoji",
      emoji: "💌",
      x: x + Math.cos(a) * 40,
      y: y + Math.sin(a) * 40,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 50,
      size: rand(16, 24),
      rot: rand(-0.4, 0.4),
      vr: rand(-1.5, 1.5),
      life: 2.2, max: 2.2,
    });
  }
  burstSparkles(x, y, 14, "#ffe9d6");
  state.glow = 0.6;
  chime(520, 0.35, "triangle", 0.05);
  setTimeout(() => chime(780, 0.3, "sine", 0.035), 110);
}

/* ------------------------------------------------------------------ */
/*  word ghosts                                                        */
/* ------------------------------------------------------------------ */
function spawnGhost(side, which, tip, hand, strong = false) {
  const style = WORDS[side][which];
  const key = side + "-" + which;
  const ws = state.wordStates.get(key);
  const baseSize = ws ? ws.size : clamp(hand.scale * 0.23, 15, 52) * style.size;
  state.ghosts.push({
    side, which, style,
    x: ws ? ws.x : tip.x,
    y: ws ? ws.y : tip.y - baseSize * 0.9,
    size: baseSize,
    anchor: Math.max(8, Math.round(baseSize / 2) * 2),
    rot: ws ? ws.rot : 0,
    born: state.time,
    dur: strong ? 1.35 : rand(0.9, 1.25),
    grow: strong ? 1.9 : 1.5,
    rise: strong ? 52 : 30,
    alpha: strong ? 0.95 : 0.75,
  });
  if (state.ghosts.length > 16) state.ghosts.shift();
}

/* ------------------------------------------------------------------ */
/*  emoji decorations                                                  */
/* ------------------------------------------------------------------ */
function emojiFor(side, tipIdx) {
  if (side === "A" && tipIdx === TIP_RING) return "💗";
  if (side === "A" && tipIdx === TIP_PINKY) return "🌸";
  if (side === "B" && tipIdx === TIP_PINKY) return "💌";
  return null;
}
function drawEmojis() {
  for (const hand of state.hands) {
    for (const tipIdx of [TIP_RING, TIP_PINKY]) {
      const emoji = emojiFor(hand.side, tipIdx);
      if (!emoji) continue;
      const tip = hand.pts[tipIdx];
      const size = clamp(hand.scale * 0.21, 10, 30);
      const bob = Math.sin(state.time * 1.9 + tipIdx) * 4;
      drawEmoji(emoji, tip.x, tip.y - size * 0.95 + bob, size, 0, 0.95);
    }
  }
}

/* ------------------------------------------------------------------ */
/*  drawing                                                            */
/* ------------------------------------------------------------------ */
const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17],
];

function drawVideo(map) {
  ctx.save();
  if (state.mirror) {
    ctx.translate(state.cw, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(video, map.dx, map.dy, map.dw, map.dh);
  ctx.restore();
}

function drawHandLines() {
  if (!state.lines) return;
  ctx.save();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  for (const hand of state.hands) {
    const pts = hand.pts;

    // both passes share one path
    ctx.beginPath();
    for (const [a, b] of HAND_CONNECTIONS) {
      ctx.moveTo(pts[a].x, pts[a].y);
      ctx.lineTo(pts[b].x, pts[b].y);
    }
    ctx.strokeStyle = "rgba(255,248,238,.14)";
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.strokeStyle = "rgba(255,248,240,.92)";
    ctx.lineWidth = 1.1;
    ctx.stroke();

    // joints in a single path
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      const tip = [4, 8, 12, 16, 20].includes(i);
      const r = tip ? 2.1 : 1.4;
      ctx.moveTo(pts[i].x + r, pts[i].y);
      ctx.arc(pts[i].x, pts[i].y, r, 0, TAU);
    }
    ctx.fillStyle = "rgba(255,250,243,.96)";
    ctx.fill();

    // colored fingertip gems
    const wordStyles = WORDS[hand.side];
    const tips = [
      [TIP_INDEX, wordStyles.index.fill],
      [TIP_MIDDLE, wordStyles.middle.fill],
      [TIP_RING, hand.side === "A" ? "#ff9fc4" : "#ffe9d9"],
      [TIP_PINKY, hand.side === "A" ? "#ffb7d2" : "#e2445c"],
    ];
    for (const [idx, color] of tips) {
      ctx.beginPath();
      ctx.arc(pts[idx].x, pts[idx].y, 3.0, 0, TAU);
      ctx.fillStyle = color === "gradBlue" ? "#bfeaf8" : color;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(pts[idx].x, pts[idx].y, 1.0, 0, TAU);
      ctx.fillStyle = "rgba(255,252,247,.95)";
      ctx.fill();
    }
  }
  ctx.restore();
}

function wordTargets(hand) {
  const pts = hand.pts;
  const styles = WORDS[hand.side];
  const sizeBase = clamp(hand.scale * 0.23, 15, 52) * (1 + clamp(-(hand.z || 0) * 1.2, -0.12, 0.28));
  const tilt = clamp((pts[9].x - pts[0].x) / (hand.scale * 2.2), -0.16, 0.16);
  const wobble = Math.sin(state.time * 1.3 + hand.palm.x * 0.02) * 0.012;
  return [
    { which: "index", tipIdx: TIP_INDEX, style: styles.index, size: sizeBase * styles.index.size, rot: tilt + wobble },
    { which: "middle", tipIdx: TIP_MIDDLE, style: styles.middle, size: sizeBase * styles.middle.size, rot: tilt * 0.7 + wobble },
  ];
}

function drawWords() {
  if (!state.words) { state.wordStates.clear(); state.ghosts.length = 0; return; }
  const seen = new Set();
  for (const hand of state.hands) {
    for (const target of wordTargets(hand)) {
      const key = hand.side + "-" + target.which;
      seen.add(key);
      const tip = hand.pts[target.tipIdx];
      const size = target.size;
      const style = target.style;
      const tx = tip.x + size * (style.dx || 0);
      const ty = tip.y - size * (style.dy || 0.85) - 7;
      let ws = state.wordStates.get(key);
      if (!ws) {
        ws = { x: tx, y: ty, size, rot: target.rot, key, lastGhost: state.time + rand(0.2, 1.2) };
        state.wordStates.set(key, ws);
      }
      ws.x = lerp(ws.x, tx, 0.30);
      ws.y = lerp(ws.y, ty, 0.30);
      ws.size = lerp(ws.size, size, 0.18);
      ws.rot = lerp(ws.rot, target.rot, 0.20);
      ws.hand = hand;

      drawWord(target.style, ws.x, ws.y, ws.size, ws.rot, 1);

      // periodic rising echo, like the reference
      if (state.time - ws.lastGhost > rand(1.4, 2.3)) {
        ws.lastGhost = state.time;
        spawnGhost(hand.side, target.which, tip, hand, false);
      }
    }
  }
  for (const key of [...state.wordStates.keys()]) {
    if (!seen.has(key)) state.wordStates.delete(key);
  }
}

function drawGhosts() {
  for (let i = state.ghosts.length - 1; i >= 0; i--) {
    const g = state.ghosts[i];
    const p = (state.time - g.born) / g.dur;
    if (p >= 1) { state.ghosts.splice(i, 1); continue; }
    const ease = 1 - Math.pow(1 - p, 2);
    drawWordAt(
      g.style,
      g.x,
      g.y - g.rise * ease,
      g.anchor,
      g.size * (1 + (g.grow - 1) * ease),
      g.rot,
      g.alpha * (1 - ease)
    );
  }
}

function drawRipples(dt) {
  for (let i = state.ripples.length - 1; i >= 0; i--) {
    const r = state.ripples[i];
    r.life -= dt;
    if (r.life <= 0) { state.ripples.splice(i, 1); continue; }
    const p = 1 - r.life / r.max;
    ctx.save();
    ctx.globalAlpha = (1 - p) * 0.7;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = 2.2 * (1 - p) + 0.5;
    ctx.shadowColor = r.color;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(r.x, r.y, lerp(r.r0, r.r1, p), 0, TAU);
    ctx.stroke();
    ctx.restore();
  }
}

function drawParticles(dt) {
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.life -= dt;
    if (p.life <= 0) { state.particles.splice(i, 1); continue; }
    const a = clamp(p.life / p.max, 0, 1);
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += (p.kind === "heart" || p.kind === "emoji" ? -8 : 26) * dt;
    p.vx *= 0.995;
    p.rot += p.vr * dt;
    ctx.save();
    ctx.globalAlpha = a * (p.kind === "heart" ? 0.9 : 0.85);
    if (p.kind === "heart") {
      const sway = Math.sin(state.time * p.sway * 2 + p.phase) * 8;
      drawHeartShape(p.x + sway, p.y, p.size, p.rot, p.color);
    } else if (p.kind === "spark") {
      drawSpark(p.x, p.y, p.size, p.rot, p.color);
    } else if (p.kind === "emoji") {
      drawEmoji(p.emoji, p.x, p.y, p.size, p.rot, a);
    } else if (p.kind === "petal") {
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.ellipse(0, 0, p.size, p.size * 0.45, 0, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }
  if (state.particles.length > 140) state.particles.splice(0, state.particles.length - 140);
}

function drawHeartShape(x, y, s, rot, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.scale(s / 16, s / 16);
  ctx.beginPath();
  ctx.moveTo(0, 8);
  ctx.bezierCurveTo(-9, 0, -9.5, -6.5, -5.2, -7.8);
  ctx.bezierCurveTo(-2.4, -8.7, -0.6, -6.4, 0, -4.9);
  ctx.bezierCurveTo(0.6, -6.4, 2.4, -8.7, 5.2, -7.8);
  ctx.bezierCurveTo(9.5, -6.5, 9, 0, 0, 8);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}
function drawSpark(x, y, s, rot, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.beginPath();
  ctx.moveTo(0, -s);
  ctx.quadraticCurveTo(s * 0.16, -s * 0.16, s, 0);
  ctx.quadraticCurveTo(s * 0.16, s * 0.16, 0, s);
  ctx.quadraticCurveTo(-s * 0.16, s * 0.16, -s, 0);
  ctx.quadraticCurveTo(-s * 0.16, -s * 0.16, 0, -s);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}

function drawFlowers(dt) {
  for (let i = state.flowers.length - 1; i >= 0; i--) {
    const f = state.flowers[i];
    f.life -= dt;
    if (f.life <= 0) { state.flowers.splice(i, 1); continue; }
    f.y += f.vy * dt;
    const p = f.life / f.max;
    const sway = Math.sin(state.time * 1.4 + f.phase) * f.sway;
    drawEmoji(
      f.emoji,
      f.x + sway,
      f.y,
      f.size,
      f.rot + Math.sin(state.time + f.phase) * 0.08,
      clamp(p * 1.6, 0, 0.95)
    );
  }
}

function drawSeal(dt) {
  if (!state.seal) return;
  const s = state.seal;
  s.t += dt;
  const p = s.t / s.dur;
  if (p >= 1) { state.seal = null; return; }
  let alpha;
  if (p < 0.10) alpha = p / 0.10;
  else if (p < 0.70) alpha = 1;
  else alpha = (1 - p) / 0.30;
  // press down: starts a bit larger, snaps to its final size
  const stamp = p < 0.18 ? 1.20 - 0.20 * (1 - Math.pow(1 - p / 0.18, 3)) : 1;
  const spr = getSealSprite();
  const drawW = Math.min(state.cw, state.ch) * 0.66 * stamp;
  const drawH = drawW * (spr.h / spr.w);
  ctx.save();
  ctx.globalAlpha = alpha * 0.97;
  ctx.translate(s.x, s.y);
  ctx.rotate(s.rot + Math.sin(state.time * 1.1) * 0.012);
  ctx.drawImage(spr.canvas, -drawW / 2, -drawH / 2, drawW, drawH);
  ctx.restore();
}

function spawnAmbient(dt) {
  state.ambientTimer -= dt;
  if (state.ambientTimer > 0) return;
  state.ambientTimer = rand(0.9, 1.8);
  if (state.particles.length < 160) {
    spawnHeart(rand(state.cw * 0.08, state.cw * 0.92), state.ch * rand(0.55, 0.95),
      null, rand(5, 12), rand(-10, 10), rand(-55, -25), rand(2.4, 4.0));
  }
}

/* ------------------------------------------------------------------ */
/*  main loop                                                          */
/* ------------------------------------------------------------------ */
let lastRender = 0;
let lastDetect = 0;
let detectInterval = 34;
let rafId = 0;
const RENDER_STEP = 1000 / 30;

function frame(now) {
  rafId = requestAnimationFrame(frame);
  // the camera is 30fps anyway; cap the whole canvas pipeline at 30fps
  if (now - lastRender < RENDER_STEP - 1) return;
  const dt = Math.min(0.05, (now - lastRender) / 1000);
  lastRender = now;
  state.time += dt;

  if (!video.videoWidth) return;
  const map = coverMap();
  ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
  ctx.clearRect(0, 0, state.cw, state.ch);

  drawVideo(map);

  // hand tracking is adaptive: when a frame is expensive, run it less often
  if (state.landmarker && video.readyState >= 2 && now - lastDetect >= detectInterval) {
    lastDetect = now;
    try {
      const t0 = performance.now();
      const result = state.landmarker.detectForVideo(video, now);
      const cost = performance.now() - t0;
      state.detectMs = state.detectMs ? state.detectMs * 0.8 + cost * 0.2 : cost;
      detectInterval =
        state.detectMs > 50 ? 110 :
        state.detectMs > 30 ? 85 :
        state.detectMs > 18 ? 60 :
        state.detectMs > 11 ? 45 : 34;
      updateHands(result, map);
    } catch (e) {
      // keep the last hands this frame
    }
  }

  spawnAmbient(dt);
  drawParticles(dt);
  drawFlowers(dt);
  drawHandLines();
  drawEmojis();
  drawGhosts();
  drawWords();
  drawRipples(dt);
  drawSeal(dt);

  // small screen flash on tap
  if (state.glow > 0) {
    state.glow = Math.max(0, state.glow - dt * 3.2);
    ctx.save();
    ctx.globalAlpha = state.glow * 0.10;
    ctx.fillStyle = "#ffe6ee";
    ctx.fillRect(0, 0, state.cw, state.ch);
    ctx.restore();
  }

  if (state.recording) {
    const t = (performance.now() - state.recStart) / 1000;
    const mm = String(Math.floor(t / 60)).padStart(2, "0");
    const ss = String(Math.floor(t % 60)).padStart(2, "0");
    recTime.textContent = `REC ${mm}:${ss}`;
  }
}

/* ------------------------------------------------------------------ */
/*  recording / snapshot                                              */
/* ------------------------------------------------------------------ */
async function toggleRecord() {
  if (state.recording) {
    try { state.rec.stop(); } catch (e) {}
    return;
  }
  try {
    const stream = canvas.captureStream(30);
    try {
      state.micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      state.micStream.getAudioTracks().forEach((t) => stream.addTrack(t));
    } catch (e) { /* silent video */ }
    const mime = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"]
      .find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
    state.rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 9_000_000 } : undefined);
    state.recChunks = [];
    state.rec.ondataavailable = (e) => { if (e.data.size) state.recChunks.push(e.data); };
    state.rec.onstop = () => {
      const blob = new Blob(state.recChunks, { type: "video/webm" });
      const a = document.createElement("a");
      const d = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      a.download = `指尖情书_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.webm`;
      a.href = URL.createObjectURL(blob);
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      state.rec = null;
      state.recording = false;
      recDot.hidden = true;
      if (state.micStream) {
        state.micStream.getTracks().forEach((t) => t.stop());
        state.micStream = null;
      }
    };
    state.rec.start(250);
    state.recording = true;
    state.recStart = performance.now();
    recDot.hidden = false;
    recTime.textContent = "REC 00:00";
    chime(620, 0.18, "sine", 0.03);
  } catch (e) {
    alert("这台设备暂时无法录制，可以直接用系统录屏。");
  }
}

function snapshot() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  canvas.toBlob((blob) => {
    if (!blob) return;
    const a = document.createElement("a");
    a.download = `指尖情书_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.png`;
    a.href = URL.createObjectURL(blob);
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, "image/png");
  state.glow = 0.6;
}

/* ------------------------------------------------------------------ */
/*  name field                                                         */
/* ------------------------------------------------------------------ */
function readName() { return nameInput.textContent.replace(/\s+/g, " ").trim(); }
function updateNameLine() {
  const hasText = readName().length > 0;
  const focused = document.activeElement === nameInput;
  nameLine.classList.toggle("show", hasText || focused);
  try { localStorage.setItem("fingertip-love-name", nameInput.textContent); } catch (e) {}
}
function focusName() {
  nameLine.classList.add("show");
  nameInput.focus();
  const range = document.createRange();
  range.selectNodeContents(nameInput);
  range.collapse(false);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}
toPill.addEventListener("click", () => { ensureAudio(); focusName(); });
nameInput.addEventListener("input", () => {
  if (nameInput.textContent.length > 24) {
    nameInput.textContent = nameInput.textContent.slice(0, 24);
    focusName();
  }
  updateNameLine();
});
nameInput.addEventListener("focus", updateNameLine);
nameInput.addEventListener("blur", updateNameLine);
nameInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); nameInput.blur(); }
});
try {
  const fromLink = (new URLSearchParams(location.search).get("to") || "").trim().slice(0, 24);
  const saved = localStorage.getItem("fingertip-love-name");
  if (fromLink) nameInput.textContent = fromLink;
  else if (saved) nameInput.textContent = saved;
  if (fromLink || saved) updateNameLine();
} catch (e) {}

/* paste plain text into the name field */
nameInput.addEventListener("paste", (e) => {
  e.preventDefault();
  const text = ((e.clipboardData || window.clipboardData).getData("text") || "")
    .replace(/\s+/g, " ")
    .slice(0, 24);
  document.execCommand("insertText", false, text);
});

/* ------------------------------------------------------------------ */
/*  keyboard                                                           */
/* ------------------------------------------------------------------ */
window.addEventListener("keydown", (e) => {
  if (e.target && (e.target.isContentEditable || e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  const k = e.key.toLowerCase();
  if (k === "e") {
    state.words = !state.words;
    hintPill.classList.toggle("off", !state.words);
    if (!state.words) stopSpeech();
  } else if (k === "k") {
    state.lines = !state.lines;
  } else if (k === "m") {
    state.mirror = !state.mirror;
  } else if (k === "r") {
    toggleRecord();
  } else if (k === "s") {
    snapshot();
  } else if (k === "h") {
    document.body.classList.toggle("ui-hidden");
  } else if (k === "q") {
    setQuality(state.quality === "high" ? "standard" : "high");
  } else if (k === "escape") {
    nameInput.blur();
  }
});

hintPill.addEventListener("click", (e) => {
  e.preventDefault();
  state.words = !state.words;
  hintPill.classList.toggle("off", !state.words);
  if (!state.words) stopSpeech();
});

/* ------------------------------------------------------------------ */
/*  first-gesture audio unlock                                         */
/* ------------------------------------------------------------------ */
function unlockAudio() {
  if (state.audioUnlocked) return;
  state.audioUnlocked = true;
  ensureAudio();
  loadSpeechClips();
  warmSpeech();
  soundTip.classList.add("gone");
  chime(880, 0.25, "sine", 0.035);
}
window.addEventListener("pointerdown", unlockAudio, { passive: true });
window.addEventListener("keydown", unlockAudio);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  ensureAudio();
  if ("speechSynthesis" in window) window.speechSynthesis.resume();
});
setTimeout(() => soundTip.classList.add("gone"), 12000);

/* ------------------------------------------------------------------ */
/*  loading                                                            */
/* ------------------------------------------------------------------ */
function setStatus(text) { loaderStatus.textContent = text; }
function showError(message) {
  loader.classList.remove("gone");
  setStatus("情书还没拆开");
  loaderNote.hidden = false;
  loaderNote.innerHTML = message;
  retryBtn.hidden = false;
}
retryBtn.addEventListener("click", async () => {
  retryBtn.hidden = true;
  loaderNote.hidden = true;
  try {
    if (!state.landmarker) {
      setStatus("正在准备手部魔法…");
      await initLandmarker();
    }
    setStatus("正在打开摄像头…");
    await startCamera();
    setStatus("把双手举到镜头前…");
    setTimeout(() => loader.classList.add("gone"), 500);
    if (!rafId) rafId = requestAnimationFrame(frame);
  } catch (e) {
    showError("还是没能打开。<br>请确认已允许摄像头权限，<br>并且页面是通过 http://localhost 或 https 打开的。");
  }
});

async function boot() {
  resize();
  await loadFonts();
  initAudioContext();
  loadSpeechClips();
  try { getSealSprite(); } catch (e) {}
  setStatus("正在准备手部魔法…");
  try {
    await initLandmarker();
  } catch (e) {
    showError("手部模型加载失败。<br>请确认 assets 文件夹完整，并通过本地服务器打开页面。");
    return;
  }
  setStatus("正在打开摄像头…");
  try {
    await startCamera();
  } catch (e) {
    const msg = String(e && e.message || e);
    showError("无法打开摄像头。<br>请允许浏览器使用摄像头后重试。<br><span style='opacity:.7'>" + msg.replace(/</g, "&lt;") + "</span>");
    return;
  }
  setStatus("把双手举到镜头前…");
  setTimeout(() => loader.classList.add("gone"), 550);
  rafId = requestAnimationFrame(frame);
}

boot();
</script>
